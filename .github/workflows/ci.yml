name: CI

# Runs on every pull request into dev or main, so nothing is merged without passing checks.
on:
  pull_request:
    branches: [dev, main]

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same Node version as locally and on Vercel.
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what package-lock.json says, unlike npm install.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
